name: Feature request
description: An idea for the free app
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read docs/FEATURES.md first. It lists what is planned and what was left out, with the reasons.

  - type: textarea
    id: problem
    attributes:
      label: What do you want to do
      description: The need, in your own words. Not the solution yet.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How the app could do it.

  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Phone
        - Android Auto
        - Both
    validations:
      required: true
