name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only builds and tests, so the token can only read the repo.
permissions:
  contents: read

# A new push to a pull request replaces its older run. Every commit on main keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Build, tests and checks
    # The repo is public, so the job runs on a GitHub hosted Linux runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A changed gradle-wrapper.jar must not run before it is checked.
      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          # A hosted runner starts empty. This keeps the downloaded libraries between runs.
          cache: gradle

      - name: Find the Android SDK
        # GitHub's runners come with the SDK and set ANDROID_HOME. The build downloads a missing platform.
        run: |
          test -d "${ANDROID_HOME:-}" || { echo "::error::No Android SDK on this runner (ANDROID_HOME is not set)"; exit 1; }

      # Unit tests, build logic tests, the premium boundary and the licence headers.
      # The module dependency rules run in every Gradle call.
      - name: Unit tests and build checks
        run: ./gradlew test --stacktrace

      # The build writes the schema of the Room database again. A difference means an entity
      # changed with no new database version, or a schema file was not committed.
      - name: Committed database schemas match the entities
        run: |
          CHANGED=$(git status --porcelain -- core/data/schemas)
          test -z "$CHANGED" || { echo "::error::Schema files differ from git: $CHANGED"; exit 1; }

      - name: Style (ktlint)
        run: ./gradlew ktlintCheck

      - name: Code rules (detekt)
        run: ./gradlew detekt

      - name: Android lint
        run: ./gradlew lint

      - name: Licences of shipped libraries
        run: ./gradlew :app:licenseeAndroidCoreRelease

      - name: Build the core debug app
        run: ./gradlew assembleCoreDebug --stacktrace

      # Shows a library update that R8 cannot build. It does not prove the shrunk app runs;
      # the end to end job runs the debug app.
      - name: Build the core release app
        run: ./gradlew assembleCoreRelease --stacktrace

      - name: Upload the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
            !**/build/reports/problems/
          retention-days: 7
          if-no-files-found: ignore

  end-to-end:
    name: End to end test on an emulator
    # The same hosted runner; it has KVM, so the emulator runs at full speed.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator is started with the tools of the SDK on the runner, so no outside action is needed.
      - name: Start an emulator
        run: |
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          adb="$ANDROID_HOME/platform-tools/adb"
          image="system-images;android-35;google_apis;x86_64"
          # avdmanager and the emulator look in different folders by default; give both the same one.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          # "yes" stops when sdkmanager closes the pipe; that is not a failure.
          (yes || true) | "$tools/sdkmanager" --install "$image" emulator platform-tools > /dev/null
          echo no | "$tools/avdmanager" create avd --name ci --package "$image" --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim > "$RUNNER_TEMP/emulator.log" 2>&1 &
          # Print the emulator's own log when it does not come up, so the cause shows in the job.
          if ! timeout 300 "$adb" wait-for-device ||
            ! timeout 600 bash -c "until [ \"\$($adb shell getprop sys.boot_completed | tr -d '\r')\" = 1 ]; do sleep 5; done"; then
            ls -l /dev/kvm || true
            tail -n 80 "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
            "$adb" shell settings put global "$scale" 0
          done

      # The main flow of the real app: scan, play, favourite, new playlist. A failed test fails the job.
      - name: Main flows on the emulator
        run: ./gradlew :app:connectedCoreDebugAndroidTest --stacktrace

      - name: Upload the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: end-to-end-reports
          path: app/build/reports/androidTests/
          retention-days: 7
          if-no-files-found: ignore
