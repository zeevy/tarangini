name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only builds and tests, so the token can only read the repo.
permissions:
  contents: read

# A new push to a pull request replaces its older run. Every commit on main keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Build, tests and checks
    # The repo is public, so the job runs on a GitHub hosted Linux runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A changed gradle-wrapper.jar must not run before it is checked.
      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          # A hosted runner starts empty. This keeps the downloaded libraries between runs.
          cache: gradle

      - name: Find the Android SDK
        # GitHub's runners come with the SDK and set ANDROID_HOME. The build downloads a missing platform.
        run: |
          test -d "${ANDROID_HOME:-}" || { echo "::error::No Android SDK on this runner (ANDROID_HOME is not set)"; exit 1; }

      # Unit tests, build logic tests, the premium boundary and the licence headers.
      # The module dependency rules run in every Gradle call.
      - name: Unit tests and build checks
        run: ./gradlew test --stacktrace

      # The build writes the schema of the Room database again. A difference means an entity
      # changed with no new database version, or a schema file was not committed.
      - name: Committed database schemas match the entities
        run: |
          CHANGED=$(git status --porcelain -- core/data/schemas)
          test -z "$CHANGED" || { echo "::error::Schema files differ from git: $CHANGED"; exit 1; }

      - name: Style (ktlint)
        run: ./gradlew ktlintCheck

      - name: Code rules (detekt)
        run: ./gradlew detekt

      - name: Android lint
        run: ./gradlew lint

      - name: Licences of shipped libraries
        run: ./gradlew :app:licenseeCoreRelease

      - name: Build the core debug app
        run: ./gradlew assembleCoreDebug --stacktrace

      - name: Upload the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
            !**/build/reports/problems/
          retention-days: 7
          if-no-files-found: ignore
