# Weekly update PRs for Gradle libraries and for the workflow actions.
# Actions are pinned by commit hash; Dependabot moves the hash and the version comment together.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    # A library joins the first group that matches, so the narrow groups come first.
    groups:
      compose:
        patterns:
          - "androidx.compose*"
      hilt:
        patterns:
          - "com.google.dagger:hilt-*"
          - "androidx.hilt:*"
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      code-checks:
        patterns:
          - "org.jlleitschuh.gradle*"
          - "com.pinterest.ktlint*"
          - "io.gitlab.arturbosch.detekt*"
          - "io.nlopez.compose.rules*"
          - "app.cash.licensee*"
    labels:
      - dependencies
      - "area:build"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Kolkata
    labels:
      - dependencies
      - "area:build"
